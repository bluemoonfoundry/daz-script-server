openapi: 3.0.3
info:
  title: DazScript Server API
  description: |
    HTTP API for remote DazScript execution inside DAZ Studio.

    ## Authentication

    All endpoints except `/status`, `/health`, and `/metrics` require a token
    when authentication is enabled (default: on). Pass the token in either:

    - `X-API-Token: <token>` header
    - `Authorization: Bearer <token>` header

    The token is auto-generated on first run and stored at
    `~/.daz3d/dazscriptserver_token.txt`.

    ## Threading model

    All DazScript execution happens serially on DAZ Studio's main Qt thread.
    "Concurrent" means HTTP connections are accepted concurrently, but scripts
    queue behind each other. The `/execute/async` family lets callers submit
    work without blocking their HTTP connection.

    ## Request identity and retry safety

    - Every response carries `X-Server-Instance-Id`, a random ID generated each
      time the server starts. `/status`, `/health`, `/capabilities` and every
      job response report it too. A changed value means the server restarted:
      in-memory jobs, registered scripts and idempotency records are gone.
    - Job routes (`/execute`, `/scripts/{id}/execute`, `/execute/async`,
      `/scripts/{id}/async`, `/render`, `/render/batch`, `/render/animation`)
      accept `X-Correlation-Id` (generated as `cor-...` when absent), echo it in
      the response header and body, and store it on async job records.
    - The async submission routes accept `Idempotency-Key`. Resubmitting the
      same body to the same route with the same key, within
      `limits.idempotency_ttl_seconds` (1 h), returns the original response
      (`idempotent_replay: true`, header `Idempotent-Replayed: true`) without
      queueing a second job. Only 2xx responses are remembered. Reusing a key
      with a different body returns 422 `IDEMPOTENCY_KEY_REUSED`; retrying while
      the first request is still being handled returns 409
      `IDEMPOTENCY_KEY_IN_FLIGHT` (retryable).
    - `scene_revision` is a counter (reset on restart) that advances on every
      structural scene change and after every executed script or job. Equal
      values within one `server_instance_id` mean no change was observed.

    | Operation | Retry safe? |
    |---|---|
    | GET routes, `DELETE /requests/{id}`, `POST /render/{id}/cancel` | Yes |
    | `/execute/async`, `/scripts/{id}/async`, `/render`, `/render/batch`, `/render/animation` | Yes with `Idempotency-Key`; otherwise a retry queues a second job |
    | `/execute`, `/scripts/{id}/execute` | No: a retry runs the script again. Use the async route + key |
    | `/scripts/register`, `DELETE /scripts/{id}` | Yes (overwrite / delete by name) |
    | `/scene/save-copy` | Yes (same output path is overwritten) |
    | `/geometry/frames` | Yes (read-only scene evaluation) |

    ## Errors

    Every failure uses one envelope (`ErrorResponse`):
    `{"success": false, "error_code": "...", "error": "...", "retryable": bool, "detail"?: "..."}`.
    HTTP-level failures use 4xx/5xx statuses. Script and job failures keep
    HTTP 200 (the exchange succeeded) and put the same fields in the execute or
    job-result body with `error_code` `SCRIPT_ERROR`, `JOB_CANCELLED` or
    `JOB_STALE`. Branch on `error_code`, not on the message text.

  version: 2.13.0
  contact:
    name: Blue Moon Foundry
    url: https://github.com/bluemoonfoundry/daz-script-server/issues
  license:
    name: AGPL v3
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://127.0.0.1:18811
    description: Default local server

tags:
  - name: Server
    description: Server status and health
  - name: Execute
    description: Synchronous script execution
  - name: Registry
    description: Registered script management
  - name: Async
    description: Asynchronous script execution and request lifecycle
  - name: SceneEvents
    description: Real-time DAZ Studio scene change notifications via SSE (v2.3.0+)
  - name: Geometry
    description: Deformed-mesh export for animation frames
  - name: Render
    description: Render job submission, progress streaming, and cancellation (v2.6.0+)
  - name: Artifacts
    description: Authenticated downloads of the files a job declared
  - name: Scene
    description: Scene file I/O
  - name: CompanionPlugins
    description: |
      Routes registered at runtime by optional companion plugins through
      `registerPluginRoute()`. They return 404 `ROUTE_NOT_FOUND` when the
      plugin is not installed. POST routes run the write chain and GET routes
      the read chain, like built-in routes; the response body is the plugin's own.

paths:
  /status:
    get:
      tags: [Server]
      summary: Check if the server is running
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                running: true
                version: "2.9.1"

  /health:
    get:
      tags: [Server]
      summary: Health check for monitoring and load balancers
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: "2.9.1"
                running: true
                auth_enabled: true
                active_requests: 2
                uptime_seconds: 3600

  /metrics:
    get:
      tags: [Server]
      summary: Request statistics and performance counters
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              example:
                total_requests: 1523
                successful_requests: 1489
                failed_requests: 28
                auth_failures: 6
                active_requests: 2
                uptime_seconds: 86400
                success_rate_percent: 97.77

  /capabilities:
    get:
      tags: [Server]
      summary: Machine-readable feature, route and limit discovery
      description: |
        Lets clients (MCP servers, SDKs) adapt to the running server instead of
        hard-coding versions. Built on the DAZ Studio main thread so
        `render_engines` is read live from DzRenderMgr. While the main thread
        is busy (render, scene load) the server returns the last document it
        built instead, with `render_engines.source: snapshot`.

        `compatibility_hash` fingerprints the schema version, route table
        (including companion-plugin routes) and feature flags. It does not
        change with limits, settings or render engines, so clients can cache
        route/feature decisions by it.
      operationId: getCapabilities
      security:
        - apiToken: []
        - bearerToken: []
      responses:
        '200':
          description: Capabilities document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Main thread busy and no snapshot built yet (Retry-After header set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /execute:
    post:
      tags: [Execute]
      summary: Execute a DazScript synchronously and return the result
      operationId: execute
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
            examples:
              inline:
                summary: Inline script
                value:
                  script: "(function(){ return Scene.getNumNodes(); })()"
                  args:
                    label: "FN Ethan"
              file:
                summary: Script file
                value:
                  scriptFile: "/path/to/script.dsa"
                  args:
                    width: 1920
                    height: 1080
      responses:
        '200':
          description: Script executed (check `success` field — errors also return 200)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /scripts/register:
    post:
      tags: [Registry]
      summary: Register or update a named script
      operationId: registerScript
      security:
        - apiToken: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: scene-info
              description: Return scene node count
              script: "(function(){ return { nodes: Scene.getNumNodes() }; })()"
      responses:
        '200':
          description: Script registered (or updated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /scripts:
    get:
      tags: [Registry]
      summary: List all registered scripts
      operationId: listScripts
      security:
        - apiToken: []
        - bearerToken: []
      responses:
        '200':
          description: Script list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /scripts/{id}/execute:
    post:
      tags: [Registry]
      summary: Execute a registered script by ID
      operationId: executeScript
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ScriptId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptExecuteRequest'
            example:
              args:
                label: "FN Ethan"
      responses:
        '200':
          description: Script executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /scripts/{id}:
    delete:
      tags: [Registry]
      summary: Remove a script from the registry
      operationId: deleteScript
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/ScriptId'
      responses:
        '200':
          description: Script removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteScriptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /execute/async:
    post:
      tags: [Async]
      summary: Submit an inline script or host-side script file for asynchronous execution
      operationId: executeAsync
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncExecuteRequest'
      responses:
        '200':
          description: Request queued — poll `/requests/{id}/status` for progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /scripts/{id}/async:
    post:
      tags: [Async]
      summary: Submit a registered script for asynchronous execution
      operationId: executeScriptAsync
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ScriptId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncScriptExecuteRequest'
      responses:
        '200':
          description: Request queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /requests:
    get:
      tags: [Async]
      summary: List all active and recently completed async requests
      operationId: listRequests
      security:
        - apiToken: []
        - bearerToken: []
      responses:
        '200':
          description: Request list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /requests/{id}/status:
    get:
      tags: [Async]
      summary: Poll the status of an async request
      operationId: getRequestStatus
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /requests/{id}/result:
    get:
      tags: [Async]
      summary: Fetch the final result of an async request
      description: |
        Returns the script result once execution is complete.

        Use `?wait=true` to long-poll until completion instead of polling
        `/requests/{id}/status` in a loop.
      operationId: getRequestResult
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: wait
          in: query
          description: Block until the request completes
          schema:
            type: boolean
            default: false
        - name: timeout
          in: query
          description: Maximum seconds to wait when `wait=true`
          schema:
            type: integer
            default: 300
            minimum: 1
            maximum: 3600
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /requests/{id}:
    delete:
      tags: [Async]
      summary: Cancel a queued or running async request
      description: |
        - `queued` requests are removed from the queue and become `cancelled`.
        - `running` requests become `cancel_requested`. A running script can't
          be interrupted; render jobs get a best-effort `killRender()`. Once the
          script returns, the status changes to its real outcome: `cancelled`
          (render aborted), `completed_after_cancel_request` (result kept) or
          `failed`. Repeating the cancel while `cancel_requested` is a no-op.
        - Finished requests return 400.
      operationId: cancelRequest
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request cancelled (queued) or cancel requested (running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /artifacts/{id}:
    get:
      tags: [Artifacts]
      summary: List the files an async job declared
      description: |
        A job's artifacts are its output manifest: outputs declared in its
        `reportFile` (`output` / `manifest` events) and, for render jobs, the
        `output_path` / `output_paths` the render wrote (failed renders declare
        nothing). Each entry gets file metadata read at request time.
        Records expire with the job (1 hour TTL).
      operationId: listArtifacts
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/ArtifactJobId'
      responses:
        '200':
          description: The job's artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /artifacts/{id}/{artifact_id}:
    get:
      tags: [Artifacts]
      summary: Download one declared artifact
      description: |
        Streams a file the job declared, so clients don't need to share a
        filesystem with DAZ Studio. URL segments are IDs looked up in the job's
        output manifest, never paths: an undeclared file can't be requested.
        The declared path must be absolute and a regular file at download time.

        Supports single and multiple byte ranges (`Range: bytes=0-1023`,
        `bytes=-512`, `bytes=1024-`), answered with 206 + `Content-Range`, and
        `HEAD` for size/type without the body. Uses the read middleware chain
        (IP whitelist, then auth), so it is not rate limited.

        **Thumbnails.** With `?thumbnail=<px>` the response is a scaled copy of
        an image artifact instead of the file: the longest edge fits in `px`
        (16-1024), the aspect ratio is kept, and the image is never upscaled.
        `format=png` (default, keeps alpha) or `format=jpeg` (alpha flattened
        onto white). The source must have an extension in `/capabilities`
        `thumbnail_source_formats` (the Qt image plugins this Studio loaded;
        EXR/HDR usually aren't) and be at most `limits.thumbnail_max_source_mb`
        and 100 megapixels, otherwise 422 `THUMBNAIL_UNSUPPORTED`.
        `thumbnail_supported` on `GET /artifacts/{id}` entries predicts this.
        Decoding runs on Studio's main thread: while it is busy (render, scene
        load, a long job), or doesn't get to the request within 10 s, the
        answer is 503 `STUDIO_BUSY` with `Retry-After`. Results are cached per
        file size/mtime, px and format (`X-Thumbnail-Cache: hit|miss`), and a
        cache hit is served even while Studio is busy. Range requests are not
        meaningful for thumbnails.
      operationId: downloadArtifact
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/ArtifactJobId'
        - name: artifact_id
          in: path
          required: true
          description: The manifest entry's `artifact_id`
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
        - name: thumbnail
          in: query
          required: false
          description: Return a thumbnail whose longest edge fits in this many pixels (image artifacts only)
          schema:
            type: integer
            minimum: 16
            maximum: 1024
        - name: format
          in: query
          required: false
          description: Thumbnail encoding (only with `thumbnail`)
          schema:
            type: string
            enum: [png, jpeg, jpg]
            default: png
        - name: Range
          in: header
          required: false
          description: RFC 9110 byte range(s)
          schema:
            type: string
            example: bytes=0-1023
      responses:
        '200':
          description: Full file content
          headers:
            Content-Length: {schema: {type: integer}}
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
            Content-Disposition:
              description: '`inline; filename="..."; filename*=UTF-8''''...`'
              schema: {type: string}
            X-Thumbnail-Cache:
              description: '`hit` or `miss`; only on `?thumbnail` responses'
              schema: {type: string, enum: [hit, miss]}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        '206':
          description: Requested byte range(s)
          headers:
            Content-Range: {schema: {type: string, example: bytes 0-1023/52344}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown job (`REQUEST_NOT_FOUND`) or undeclared artifact (`ARTIFACT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/ArtifactUnavailable'
        '416':
          description: Range outside the file
        '422':
          description: |
            `?thumbnail` on an artifact that can't be thumbnailed
            (`THUMBNAIL_UNSUPPORTED`): no Qt decoder for its type, undecodable
            content, or over the size limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /scene/events:
    get:
      tags: [SceneEvents]
      summary: Subscribe to real-time scene-change notifications (SSE)
      description: |
        Opens a persistent connection and streams DAZ Studio scene-change events
        as Server-Sent Events. A `:keepalive` comment is sent every 3 seconds of
        idle time so clients can detect disconnects.

        The connection stays open until the client disconnects or the server stops.
        All configured security checks (auth, IP whitelist) apply.
      operationId: sceneEvents
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - name: filter
          in: query
          required: false
          description: |
            Comma-separated list of event categories to receive. Omit to receive all.
            Values: `node`, `skeleton`, `light`, `camera`, `selection`, `scene`, `time`, `render`
          schema:
            type: string
            example: "node,scene"
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-delimited SSE events. Each event is:
                  `data: {"type":"<event_type>","ts":<unix_ms>,"data":{...}}\n\n`
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /render:
    post:
      tags: [Render]
      summary: Submit a render job
      description: |
        Submits a render job to DAZ Studio and returns a `request_id` immediately.
        Use `GET /render/{id}/progress` to stream live progress, or
        `GET /requests/{id}/result` (with `?wait=true`) to long-poll for completion.
      operationId: submitRender
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: Render job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /render/batch:
    post:
      tags: [Render]
      summary: Submit multiple render variants in one request
      description: |
        Each variant can override morphs and output path. Renders execute
        sequentially on DAZ Studio's main thread.
      operationId: submitRenderBatch
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderBatchRequest'
      responses:
        '200':
          description: Batch submitted; one `request_id` per variant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JobIdentity'
                  - type: object
                    required: [request_ids]
                    properties:
                      batch_id:
                        type: string
                      request_ids:
                        type: array
                        items:
                          type: string
                        description: One `request_id` per variant, in submission order
                      total:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /render/animation:
    post:
      tags: [Render]
      summary: Submit a per-frame animation render job
      description: |
        Renders each frame from `start_frame` to `end_frame` inclusive as its own
        image and returns a `request_id` immediately. The `{frame}` token in
        `output_path` is replaced by the zero-padded frame number. Progress
        advances at frame boundaries: the job status reports frame N of M
        (`progress_source: frames`, `observation.progress.frame` / `total`) on
        Studio 4 and 6, and `GET /render/{id}/progress` streams it as SSE
        `progress` events on both.
        The completed job's output manifest lists every frame written (`kind: "frame"`).
        If `camera` is given, the server checks that it exists in the scene before queueing.
      operationId: submitRenderAnimation
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderAnimationRequest'
      responses:
        '200':
          description: Animation render job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyInFlight'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /render/{id}/progress:
    get:
      tags: [Render]
      summary: Stream render progress via SSE
      description: |
        Opens an SSE connection for the given render job and delivers progress
        events until the render completes or fails. The SDK exposes no
        intra-frame percent, so a single-frame render gets a 0% event when it
        starts and then a terminal event. An animation render
        (`POST /render/animation`) also gets `progress` events at frame
        boundaries. Studio 4 sends one per frame. Studio 6 checks the frame
        report every 0.5 s, so frames faster than that are merged into an event
        for the latest frame. Frame numbers only ever increase. A subscriber
        that joins mid-render first
        receives the latest frame event. If the render already finished, the
        stored terminal event is sent and the stream closes. `:keepalive`
        comments are sent about every 3 s while idle.
      operationId: renderProgress
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: SSE stream of render progress events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Start (`event: progress`):
                  `data: {"request_id":"rnd-1a2b3c4d","percent":0}`
                  Frame boundary, animation renders (`event: progress`; frame N of M about to start):
                  `data: {"request_id":"rnd-1a2b3c4d","percent":25.00,"frame":2,"total_frames":8}`
                  Completion (`event: complete`):
                  `data: {"request_id":"rnd-1a2b3c4d","output_path":"/path/render.png","file_size_bytes":123456,"duration_ms":9800}`
                  Failure or cancellation (`event: error`):
                  `data: {"request_id":"rnd-1a2b3c4d","error":"...","duration_ms":1200}`
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /render/{id}/cancel:
    post:
      tags: [Render]
      summary: Cancel a queued or running render job
      description: |
        Returns 400 if the `request_id` belongs to a non-render request, so
        callers get a clear error rather than silently cancelling the wrong job.
      operationId: cancelRender
      security:
        - apiToken: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Render cancelled (queued) or abort requested (running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /geometry/frames:
    post:
      tags: [Geometry]
      summary: Export deformed figure vertices for a list of frames
      description: |
        Returns the deformed figure mesh (base cage by default, optionally a
        vertex/surface subset) plus world-space bone origins for each requested
        frame as one little-endian binary payload. Only the figure is
        re-evaluated per frame; the original frame and resolution level are
        restored afterwards, followed by one Scene update unless
        `sceneUpdate` is false.

        Response layout: `char magic[4]="DZGF"`, `uint32 version=1`,
        `uint32 numFrames`, `uint32 numVerts`, `uint32 numBones`,
        `uint32 flags` (bit 0 = index section present), `uint32 reserved[2]`,
        `int32 frames[numFrames]`, `uint32 indices[numVerts]` (only if
        `flags & 1`), `float32 verts[numFrames][numVerts][3]`,
        `float32 bones[numFrames][numBones][3]`.
      operationId: exportGeometryFrames
      security:
        - apiToken: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frames]
              properties:
                frames:
                  type: array
                  minItems: 1
                  items: {type: integer}
                  description: Frame numbers to evaluate
                node:
                  type: string
                  description: Figure name or label (default is the first figure)
                indices:
                  type: array
                  items: {type: integer}
                  description: Vertex subset to return
                surfaces:
                  type: array
                  items: {type: string}
                  description: Adds every vertex of these surfaces to the subset
                bones:
                  type: array
                  items: {type: string}
                  description: Bones whose world-space origins are returned per frame
                resolution:
                  type: string
                  enum: [base, current]
                  default: base
                sceneUpdate:
                  type: boolean
                  default: true
                  description: false skips the final Scene update
            example:
              frames: [0, 10, 20]
              bones: [lHand, rHand]
      responses:
        '200':
          description: Binary DZGF payload
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /scene/save-copy:
    post:
      tags: [Scene]
      summary: Save a copy of the current scene
      description: |
        Writes the current scene to `path` without changing the scene's
        filename or dirty flag ("Save a Copy As…"). A clean scene that already
        has a file on disk is copied byte for byte (`method: "copy"`). A dirty
        scene is serialized with `Scene.saveScene()` (`"serialize"`); if that
        changes the scene's filename, the original file is saved again to
        restore it (`"serialize+restore"`), which also writes the unsaved
        changes to the original file. An existing file at `path` is overwritten,
        so retries are safe.
      operationId: saveSceneCopy
      security:
        - apiToken: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCopyRequest'
      responses:
        '200':
          description: Copy written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveCopyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: File copy or `saveScene()` failed (`INTERNAL_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: X-API-Token
    bearerToken:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-chosen key (1-255 printable ASCII, no spaces). A repeat of the
        same route + body + key within the TTL returns the original response
        instead of submitting a second job.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]{1,255}$'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client trace ID (1-255 printable ASCII, no spaces). Generated when absent.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]{1,255}$'
    ScriptId:
      name: id
      in: path
      required: true
      description: Script name (1-64 chars, `[A-Za-z0-9_-]`)
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
    ArtifactJobId:
      name: id
      in: path
      required: true
      description: Async request ID whose artifacts to access
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'

    RequestId:
      name: id
      in: path
      required: true
      description: Async request ID (8-char UUID)
      schema:
        type: string
        minLength: 8
        maxLength: 8

  schemas:
    FigureMorphs:
      type: object
      required: [figure_label, morphs]
      properties:
        figure_label:
          type: string
          description: Scene-panel label of the figure (e.g. "Genesis 9")
          example: "Genesis 9"
        morphs:
          type: object
          additionalProperties:
            type: number
            format: float
          description: Morph name → value (0.0–1.0) map
          example:
            eCTRLSmileSimple: 1.0

    RenderRequest:
      type: object
      properties:
        output_path:
          type: string
          description: Absolute path for the output image
          example: "C:/renders/out.png"
        width:
          type: integer
          description: Render width in pixels
          example: 1920
        height:
          type: integer
          description: Render height in pixels
          example: 1080
        camera:
          type: string
          description: Scene-panel label of the camera to use
          example: "Camera 1"
        engine:
          type: string
          enum: [iray, viewport, filament]
          description: Render engine; omitted keeps the scene's current selection
        iray_samples:
          type: integer
          minimum: 0
          description: |
            Per-render Iray "Max Samples" override (0 or omitted = scene setting).
            Applied through the Iray renderer's property holder, read back, and
            restored after the render; the job result's `iray_samples` object
            reports `requested`, `applied`, `previous` and `restored`. Rejected
            with 400 when `engine` is `viewport`/`filament`, and the job fails if
            the effective render is not Iray or the value is outside the
            property's range (1..25000 on DS 6.26).
          example: 500
        figure_morphs:
          type: array
          items:
            $ref: '#/components/schemas/FigureMorphs'
          description: Per-figure morph overrides applied before rendering

    RenderAnimationRequest:
      type: object
      required: [output_path, start_frame, end_frame]
      properties:
        output_path:
          type: string
          description: Absolute output path; must contain the literal token `{frame}`
          example: "C:/renders/walk_{frame}.png"
        start_frame:
          type: integer
          minimum: 0
          description: First frame to render
          example: 0
        end_frame:
          type: integer
          minimum: 0
          description: |
            Last frame to render, inclusive; must be >= `start_frame`. At most
            1000 frames per job.
          example: 47
        frame_padding:
          type: integer
          minimum: 1
          maximum: 10
          default: 4
          description: Zero-padded width of the number substituted for `{frame}`
        width:
          type: integer
          minimum: 1
          description: Render width in pixels; must be given together with `height`
          example: 1920
        height:
          type: integer
          minimum: 1
          description: Render height in pixels; must be given together with `width`
          example: 1080
        camera:
          type: string
          description: Scene-panel label of the camera to use (400 if not found)
          example: "Camera 1"
        engine:
          type: string
          enum: [iray, viewport, filament]
          description: Render engine; omitted keeps the scene's current selection

    SaveCopyRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Destination `.duf` path; overwritten if it exists
          example: "C:/backups/scene_v2.duf"

    SaveCopyResponse:
      type: object
      required: [ok, path, source, method]
      properties:
        ok:
          type: boolean
          enum: [true]
        path:
          type: string
          description: Destination path written
        source:
          type: string
          description: The scene's own filename (empty for a never-saved scene)
        method:
          type: string
          enum: [copy, serialize, serialize+restore]
          description: How the copy was produced (see the route description)

    RenderVariant:
      type: object
      properties:
        label:
          type: string
          description: Identifier for this variant (used in output filename if no output_path)
          example: "smile"
        output_path:
          type: string
          description: Absolute path for this variant's output image
        figure_morphs:
          type: array
          items:
            $ref: '#/components/schemas/FigureMorphs'
          description: Per-figure morph overrides for this variant

    RenderBatchRequest:
      type: object
      required: [variants]
      properties:
        width:
          type: integer
          example: 1920
        height:
          type: integer
          example: 1080
        camera:
          type: string
          example: "Camera 1"
        variants:
          type: array
          items:
            $ref: '#/components/schemas/RenderVariant'
          description: List of render variants to submit sequentially

    ExecuteRequest:
      type: object
      description: |
        Provide either `script` (inline code) or `scriptFile` (absolute path).
        If both are given, `scriptFile` takes precedence.
      properties:
        script:
          type: string
          description: Inline DazScript source code (max configurable, default 1 MB)
          example: "(function(){ return Scene.getNumNodes(); })()"
        scriptFile:
          type: string
          description: Absolute path to a `.dsa` file on the DAZ Studio machine
          example: "/path/to/render.dsa"
        args:
          type: object
          description: Arbitrary JSON object; accessible inside the script via `getArguments()[0]`
          additionalProperties: true
          example:
            width: 1920
            height: 1080

    ExecuteResponse:
      type: object
      required: [success, result, output, error, request_id]
      properties:
        success:
          type: boolean
          description: "`true` if the script ran without throwing"
        result:
          description: Script return value (any JSON-serialisable type), or `null` on error
          nullable: true
        output:
          type: array
          items:
            type: string
          description: Lines captured from `print()` calls (max 10,000)
        error:
          type: string
          nullable: true
          description: Error message with line number, or `null`
        request_id:
          type: string
          description: 8-character ID for log correlation
          example: "a3f2b891"
        error_code:
          type: string
          enum: [SCRIPT_ERROR]
          description: Present only when `success` is false
        retryable:
          type: boolean
          description: Present only when `success` is false
        server_instance_id:
          type: string
        correlation_id:
          type: string
        scene_revision:
          type: integer

    JobIdentity:
      type: object
      description: Identity fields stamped on job route responses (success and error).
      properties:
        server_instance_id:
          type: string
          description: Random per-run server ID; changes on every server start
          example: "srv-3f9a1c0b7d2e4a55"
        correlation_id:
          type: string
          description: Client `X-Correlation-Id`, or a generated `cor-...` ID
          example: "cor-1b2c3d4e"
        scene_revision:
          type: integer
          description: Scene change counter at response time (reset on restart)
        idempotent_replay:
          type: boolean
          description: Present (true) only when this is a replay of an earlier response

    RegisterRequest:
      type: object
      required: [name, script]
      properties:
        name:
          type: string
          description: Script ID — 1-64 chars, `[A-Za-z0-9_-]` only
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          example: scene-info
        script:
          type: string
          description: DazScript source code
        description:
          type: string
          description: Human-readable description

    RegisterResponse:
      type: object
      required: [success, id, registered_at, updated]
      properties:
        success:
          type: boolean
        id:
          type: string
          example: scene-info
        registered_at:
          type: string
          format: date-time
          example: "2026-05-14T10:15:00"
        updated:
          type: boolean
          description: "`true` if this overwrote an existing registration"

    ScriptListResponse:
      type: object
      required: [scripts, count]
      properties:
        scripts:
          type: array
          items:
            type: object
            required: [name, registered_at]
            properties:
              name:
                type: string
                description: Registered script name (the `{id}` in `/scripts/{id}/...`)
              description:
                type: string
              registered_at:
                type: string
                format: date-time
        count:
          type: integer

    ScriptExecuteRequest:
      type: object
      properties:
        args:
          type: object
          additionalProperties: true

    AsyncExecuteRequest:
      allOf:
        - $ref: '#/components/schemas/ExecuteRequest'
        - type: object
          properties:
            reportFile:
              type: string
              description: |
                Optional absolute path to a per-job JSONL event file. The
                server truncates it at submission and ingests progress, log,
                output, and manifest events into the async request's
                observation record. The path is also injected into args as
                reserved field `__dssReportFile`.
                DAZ Studio 6 exposes report events while a job is running;
                Studio 4 parses the final report after execution returns.
              example: "/path/to/run/job.jsonl"

    AsyncScriptExecuteRequest:
      allOf:
        - $ref: '#/components/schemas/ScriptExecuteRequest'
        - type: object
          properties:
            reportFile:
              type: string
              description: Optional absolute path to the per-job JSONL event file

    DeleteScriptResponse:
      type: object
      required: [success, id]
      properties:
        success:
          type: boolean
        id:
          type: string

    AsyncSubmitResponse:
      allOf:
        - $ref: '#/components/schemas/JobIdentity'
        - type: object
          required: [request_id, status, submitted_at]
          properties:
            request_id:
              type: string
              example: "execute-a3f2b891"
            status:
              type: string
              enum: [queued]
            submitted_at:
              type: string
              format: date-time

    RequestListResponse:
      type: object
      required: [requests, total, queued, running, completed]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/RequestSummary'
        total:
          type: integer
        queued:
          type: integer
        running:
          type: integer
        completed:
          type: integer

    RequestSummary:
      type: object
      required: [request_id, status, submitted_at]
      properties:
        request_id:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        correlation_id:
          type: string
          description: Correlation ID the job was submitted with
        server_instance_id:
          type: string
          description: Server run that accepted the job
        submitted_at:
          type: string
          format: date-time
        elapsed_ms:
          type: integer
        progress:
          type: number
          format: float
        progress_supported:
          type: boolean
          description: |
            Whether `progress` can change while the job runs. True for
            animation renders and, on Studio 6, for script jobs with a
            `reportFile`. False for single-frame renders (start and finish
            only) and scripts without a report file.
        progress_source:
          type: string
          enum: [frames, report, none]
          description: |
            `frames`: animation render, one step per frame. `report`: the
            job's `reportFile` progress events (Studio 4 parses them only
            after the script returns). `none`: no progress until it finishes.
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Latest sign of life: job start, a frame boundary, a report-file
            write (any event, including `heartbeat`), a printed line (Studio 4
            only), or completion. Null while queued.
        idle_ms:
          type: integer
          description: |
            Milliseconds since `last_activity_at`. Present only while the job
            is running, `cancel_requested` or `stale`.

    RequestStatusResponse:
      type: object
      required: [request_id, status]
      properties:
        request_id:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        correlation_id:
          type: string
          description: Correlation ID the job was submitted with
        server_instance_id:
          type: string
          description: Server run that accepted the job
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
        progress_supported:
          type: boolean
          description: |
            Whether `progress` can change while the job runs. True for
            animation renders and, on Studio 6, for script jobs with a
            `reportFile`. False for single-frame renders (start and finish
            only) and scripts without a report file.
        progress_source:
          type: string
          enum: [frames, report, none]
          description: |
            `frames`: animation render, one step per frame. `report`: the
            job's `reportFile` progress events (Studio 4 parses them only
            after the script returns). `none`: no progress until it finishes.
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Latest sign of life: job start, a frame boundary, a report-file
            write (any event, including `heartbeat`), a printed line (Studio 4
            only), or completion. Null while queued.
        idle_ms:
          type: integer
          description: |
            Milliseconds since `last_activity_at`. Present only while the job
            is running, `cancel_requested` or `stale`.
        observation:
          $ref: '#/components/schemas/JobObservation'
        elapsed_ms:
          type: integer
        queue_position:
          type: integer
          description: Only meaningful when `status` is `queued`

    AsyncResultResponse:
      allOf:
        - $ref: '#/components/schemas/ExecuteResponse'
        - type: object
          required: [duration_ms, completed_at, status]
          properties:
            duration_ms:
              type: integer
            completed_at:
              type: string
              format: date-time
            status:
              $ref: '#/components/schemas/RequestStatus'
            observation:
              $ref: '#/components/schemas/JobObservation'
            error_code:
              type: string
              enum: [SCRIPT_ERROR, JOB_CANCELLED, JOB_STALE]
              description: Present when `success` is false
            retryable:
              type: boolean
            correlation_id:
              type: string
            server_instance_id:
              type: string
            progress_supported:
              type: boolean
              description: |
                Whether `progress` can change while the job runs. True for
                animation renders and, on Studio 6, for script jobs with a
                `reportFile`. False for single-frame renders (start and finish
                only) and scripts without a report file.
            progress_source:
              type: string
              enum: [frames, report, none]
              description: |
                `frames`: animation render, one step per frame. `report`: the
                job's `reportFile` progress events (Studio 4 parses them only
                after the script returns). `none`: no progress until it finishes.
            last_activity_at:
              type: string
              format: date-time
              nullable: true
              description: |
                Latest sign of life: job start, a frame boundary, a report-file
                write (any event, including `heartbeat`), a printed line (Studio 4
                only), or completion. Null while queued.
            idle_ms:
              type: integer
              description: |
                Milliseconds since `last_activity_at`. Present only while the job
                is running, `cancel_requested` or `stale`.

    JobObservation:
      type: object
      required: [progress, log_tail, log_total, log_truncated, output_manifest]
      properties:
        progress:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/JobProgress'
        log_tail:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/JobLogEntry'
        log_total:
          type: integer
        log_truncated:
          type: boolean
        output_manifest:
          $ref: '#/components/schemas/JobOutputManifest'
        report_file:
          type: string
          description: The client's `reportFile`. Omitted for server-owned reports (animation renders).

    JobProgress:
      type: object
      required: [value]
      properties:
        value:
          type: number
          minimum: 0
          maximum: 1
        current:
          type: number
        total:
          type: number
        frame:
          type: integer
          description: Animation renders only; the 1-based frame now rendering (`current` counts finished frames)
        phase:
          type: string
          description: Animation renders use `rendering`, then `done`
        message:
          type: string
        at:
          type: string

    JobLogEntry:
      type: object
      required: [message, level, source]
      properties:
        message:
          type: string
        level:
          type: string
        source:
          type: string
        at:
          type: string

    JobOutputManifest:
      type: object
      required: [count, outputs]
      properties:
        count:
          type: integer
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/JobOutput'

    JobOutput:
      type: object
      required: [path, artifact_id, url]
      properties:
        path:
          type: string
          description: Host filesystem path as declared by the job
        artifact_id:
          type: string
          description: Stable ID (position in the manifest); re-declaring a path keeps it
        url:
          type: string
          description: Download path, `/artifacts/{id}/{artifact_id}`
        kind:
          type: string
          description: Declared kind; render jobs use `render` (/render) and `frame` (/render/animation)
        label:
          type: string
        metadata:
          type: object
          additionalProperties: true

    ArtifactEntry:
      allOf:
        - $ref: '#/components/schemas/JobOutput'
        - type: object
          required: [available, size, content_type, filename]
          properties:
            available:
              type: boolean
              description: The declared path is an absolute, existing regular file
            size:
              type: integer
              nullable: true
              description: Size in bytes, or null when unavailable
            content_type:
              type: string
              description: MIME type by extension (application/octet-stream if unknown)
            filename:
              type: string
            thumbnail_supported:
              type: boolean
              description: |
                `?thumbnail` should work: available, within the size limit, and
                an extension Qt can decode here. The content is only checked
                when a thumbnail is requested.

    ArtifactListResponse:
      type: object
      required: [success, request_id, status, count, artifacts]
      properties:
        success:
          type: boolean
        request_id:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        count:
          type: integer
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactEntry'

    CancelResponse:
      type: object
      required: [request_id, status, cancel_requested_at, message]
      properties:
        request_id:
          type: string
        status:
          type: string
          enum: [cancelled, cancel_requested, stale]
          description: |
            `cancelled` only when the request was still queued. Otherwise the
            request's current status; poll it for the real outcome.
        message:
          type: string
        cancel_requested_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time
          description: Present only when `status` is `cancelled`

    RequestStatus:
      type: string
      enum:
        - queued
        - running
        - cancel_requested
        - stale
        - completed
        - failed
        - cancelled
        - completed_after_cancel_request
        - completed_after_stale
      description: |
        Final: `completed`, `failed`, `cancelled`,
        `completed_after_cancel_request`, `completed_after_stale`.
        Not final: `cancel_requested` (cancel asked while the script was
        running) and `stale` (running past the pane's Stuck Job Timeout, default 30 min;
        reported with `success: false` and ends long-polls, but changes to the
        real outcome if the script returns). `cancelled` means the work
        really stopped: it never started, or a render was aborted. Results
        keep `cancel_requested_at` / `stale_at` once set.

    StatusResponse:
      type: object
      required: [running, version, server_instance_id, scene_revision]
      properties:
        running:
          type: boolean
        version:
          type: string
        server_instance_id:
          type: string
          example: "srv-3f9a1c0b7d2e4a55"
        scene_revision:
          type: integer

    HealthResponse:
      type: object
      required: [status, version, running, auth_enabled, active_requests, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        running:
          type: boolean
        auth_enabled:
          type: boolean
        active_requests:
          type: integer
        uptime_seconds:
          type: integer
        server_instance_id:
          type: string
        scene_revision:
          type: integer

    MetricsResponse:
      type: object
      required: [total_requests, successful_requests, failed_requests, auth_failures, active_requests, uptime_seconds, success_rate_percent]
      properties:
        total_requests:
          type: integer
        successful_requests:
          type: integer
        failed_requests:
          type: integer
        auth_failures:
          type: integer
        active_requests:
          type: integer
        uptime_seconds:
          type: integer
        success_rate_percent:
          type: number
          format: float

    CapabilitiesResponse:
      type: object
      required: [schema_version, compatibility_hash, server, studio, routes, plugin_routes,
                 features, limits, rate_limit, security, render_engines]
      properties:
        schema_version:
          type: integer
          description: Bumped on breaking changes to this document's shape
          example: 1
        compatibility_hash:
          type: string
          description: 16-hex-char fingerprint of schema + routes + feature flags
          example: "3f9a1c0b7d2e4a55"
        server:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              example: DazScriptServer
            version:
              type: string
              example: "2.12.0"
            instance_id:
              type: string
              description: Same value as `server_instance_id` on `/status`
        studio:
          type: object
          required: [version, sdk_version, sdk_major, qt_version, qt_build_version]
          properties:
            version:
              type: string
              description: Running DAZ Studio version
              example: "4.24.0.3"
            sdk_version:
              type: string
              description: DAZ SDK the plugin was built against
              example: "4.5.0.100"
            sdk_major:
              type: integer
              enum: [4, 6]
            qt_version:
              type: string
              description: Qt runtime version
            qt_build_version:
              type: string
              description: Qt version the plugin was compiled against
        routes:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityRoute'
        plugin_routes:
          type: array
          description: Routes registered by companion plugins
          items:
            type: object
            required: [method, path, auth]
            properties:
              method:
                type: string
              path:
                type: string
              auth:
                type: boolean
              owner:
                type: string
                description: Class name of the registering QObject
              plugin:
                type: string
                description: Companion plugin name, when the route was registered with one
        companion_plugins:
          type: array
          description: |
            Companion plugins and their routes. Plugins name themselves with
            registerCompanionPlugin(); routes registered without a plugin name
            are grouped by handler class with `registered: false`.
          items:
            type: object
            required: [name, registered, version, routes]
            properties:
              name:
                type: string
                description: Plugin name, or the handler class name when `registered` is false
                example: my-exporter
              registered:
                type: boolean
              version:
                type: string
                nullable: true
                example: "1.0.0"
              description:
                type: string
              routes:
                type: array
                items:
                  type: object
                  required: [method, path, auth]
                  properties:
                    method:
                      type: string
                    path:
                      type: string
                    auth:
                      type: boolean
        features:
          type: object
          description: Feature flags. Unknown keys must be ignored by clients.
          additionalProperties:
            type: boolean
          properties:
            async: {type: boolean}
            async_cancel: {type: boolean}
            async_long_poll: {type: boolean}
            report_file: {type: boolean}
            script_registry: {type: boolean}
            sse_scene_events: {type: boolean}
            sse_render_progress: {type: boolean}
            render: {type: boolean}
            render_batch: {type: boolean}
            render_animation: {type: boolean}
            render_cancel: {type: boolean}
            scene_save_copy: {type: boolean}
            geometry_frames: {type: boolean}
            companion_plugins:
              type: boolean
              description: True when at least one companion-plugin route is registered
            idempotency_key: {type: boolean}
            correlation_id: {type: boolean}
            server_instance_id: {type: boolean}
            scene_revision: {type: boolean}
            error_envelope: {type: boolean}
            artifacts:
              type: boolean
              description: GET /artifacts/{id} and /artifacts/{id}/{artifact_id}
            job_activity:
              type: boolean
              description: Job records carry progress_supported, progress_source, last_activity_at and idle_ms
            animation_frame_progress:
              type: boolean
              description: Animation render job status reports frame N of M (Studio 4 and 6)
            artifact_thumbnails:
              type: boolean
              description: GET /artifacts/{id}/{artifact_id}?thumbnail=<px>
        thumbnail_source_formats:
          type: array
          items: {type: string}
          description: Lower-case file extensions ?thumbnail can decode (Qt image plugins loaded in this Studio)
        limits:
          type: object
          description: Current settings (not compiled defaults)
          properties:
            max_body_size_mb: {type: integer}
            max_script_length_kb: {type: integer}
            max_concurrent_requests: {type: integer}
            max_batch_variants: {type: integer}
            max_animation_frames: {type: integer}
            async_max_queue_depth: {type: integer}
            async_result_ttl_seconds: {type: integer}
            idempotency_ttl_seconds: {type: integer}
            stale_job_timeout_minutes: {type: integer}
            thumbnail_min_px: {type: integer}
            thumbnail_max_px: {type: integer}
            thumbnail_max_source_mb: {type: integer}
        rate_limit:
          type: object
          properties:
            enabled: {type: boolean}
            max_requests: {type: integer}
            window_seconds: {type: integer}
            applies_to:
              type: string
              enum: [write]
              description: Only POST/DELETE routes are rate limited
        security:
          type: object
          properties:
            auth_enabled: {type: boolean}
            auth_headers:
              type: array
              items: {type: string}
            ip_whitelist_enabled: {type: boolean}
        render_engines:
          type: object
          required: [registered, selectable, active_class, source, read_at]
          properties:
            registered:
              type: array
              items:
                type: object
                required: [class_name, name, active]
                properties:
                  class_name: {type: string, example: DzIrayRenderer}
                  name: {type: string, example: NVIDIA Iray}
                  active: {type: boolean}
            selectable:
              type: array
              description: Values POST /render currently accepts for "engine"
              items:
                type: string
                enum: [viewport, iray, filament]
            active_class:
              type: string
              nullable: true
            source:
              type: string
              enum: [live, snapshot]
            read_at:
              type: string
              format: date-time
              description: When render engines were read (UTC)

    CapabilityRoute:
      type: object
      required: [method, path, auth, kind]
      properties:
        method:
          type: string
          enum: [GET, POST, DELETE]
        path:
          type: string
          description: Path with {id} placeholders
          example: /requests/{id}/status
        auth:
          type: boolean
        kind:
          type: string
          enum: [json, sse, binary]

    ErrorResponse:
      type: object
      description: |
        The one error envelope used by every failure. Job routes also stamp
        `JobIdentity` fields into it. Unknown `error_code` values must be
        treated as non-retryable failures.
      required: [success, error_code, error, retryable]
      properties:
        success:
          type: boolean
          enum: [false]
        error_code:
          type: string
          description: Stable, machine-readable code
          enum:
            - AUTH_MISSING_TOKEN
            - AUTH_INVALID_TOKEN
            - IP_NOT_WHITELISTED
            - SCRIPT_NOT_FOUND
            - REQUEST_NOT_FOUND
            - ROUTE_NOT_FOUND
            - ARTIFACT_NOT_FOUND
            - ARTIFACT_UNAVAILABLE
            - IDEMPOTENCY_KEY_IN_FLIGHT
            - IDEMPOTENCY_KEY_REUSED
            - THUMBNAIL_UNSUPPORTED
            - BODY_TOO_LARGE
            - RATE_LIMIT_EXCEEDED
            - CONCURRENT_LIMIT_EXCEEDED
            - BAD_REQUEST
            - INVALID_JSON
            - MISSING_FIELD
            - INVALID_FIELD
            - SCRIPT_TOO_LARGE
            - SCRIPT_FILE_NOT_FOUND
            - SCRIPT_FILE_NOT_FILE
            - SCRIPT_FILE_NOT_ABSOLUTE
            - SCRIPT_FILE_LOAD_FAILED
            - NOT_A_RENDER_REQUEST
            - REQUEST_ALREADY_FINISHED
            - SERVER_UNAVAILABLE
            - STUDIO_BUSY
            - INTERNAL_ERROR
        error:
          type: string
          description: Human-readable message (may change between versions)
        retryable:
          type: boolean
          description: True when an identical retry may succeed (busy, rate limited, queue full, key in flight)
        detail:
          type: string
          description: Optional context, e.g. the offending field or ID
        server_instance_id:
          type: string
        correlation_id:
          type: string

  responses:
    BadRequest:
      description: Malformed JSON or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: INVALID_JSON
            error: "Invalid JSON in request body"
            retryable: false
    Unauthorized:
      description: Missing or invalid API token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: AUTH_INVALID_TOKEN
            error: "Authentication failed: invalid or missing API token"
            retryable: false
    Forbidden:
      description: IP address not in whitelist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: IP_NOT_WHITELISTED
            error: "Access denied: IP address is not in the whitelist"
            retryable: false
    NotFound:
      description: Script or request ID not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: SCRIPT_NOT_FOUND
            error: "Script not found in registry"
            retryable: false
    ArtifactUnavailable:
      description: Declared artifact whose file is missing, not a regular file, or not an absolute path
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: ARTIFACT_UNAVAILABLE
            error: "Artifact was declared but its file is missing, not a regular file, or not an absolute path"
            retryable: false
            detail: "declared file does not exist or cannot be read"
    TooLarge:
      description: Request body exceeds configured maximum
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: BODY_TOO_LARGE
            error: "Request body exceeds maximum allowed size"
            retryable: false
    TooManyRequests:
      description: Concurrent request limit or per-IP rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: CONCURRENT_LIMIT_EXCEEDED
            error: "Server busy: maximum concurrent requests reached, please retry"
            retryable: true
    ServiceUnavailable:
      description: Studio main thread busy, or the job queue is full (retry; `Retry-After` may be set)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: STUDIO_BUSY
            error: "DAZ Studio's main thread is busy; please retry shortly"
            retryable: true
    IdempotencyInFlight:
      description: A request with this Idempotency-Key is still being processed (retry after `Retry-After`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: IDEMPOTENCY_KEY_IN_FLIGHT
            error: "A request with this Idempotency-Key is still being processed; retry shortly"
            retryable: true
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used on this route with a different body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error_code: IDEMPOTENCY_KEY_REUSED
            error: "This Idempotency-Key was already used on this route with a different request body"
            retryable: false
