name: Docs

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel the in-flight run if a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dazpy and Sphinx dependencies
        run: pip install -e ".[docs]"

      - name: Build Sphinx docs
        run: sphinx-build -b html docs docs/_build/html

      - name: Generate Redoc API reference page
        run: |
          mkdir -p docs/_build/html/api-reference
          cp openapi.yaml docs/_build/html/api-reference/openapi.yaml
          cat > docs/_build/html/api-reference/index.html << 'REDOC_EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>DazScript Server — HTTP API Reference</title>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>body { margin: 0; padding: 0; }</style>
          </head>
          <body>
            <redoc spec-url='openapi.yaml'></redoc>
            <!-- Pinned Redoc + Subresource Integrity. To bump, update the version and
                 regenerate the hash:
                 curl -fsSL <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
            <script src="https://cdn.jsdelivr.net/npm/redoc@3.1.0/bundles/redoc.standalone.js"
                    integrity="sha384-JeMYOUn7XELj12XQpz8IRcyCi5pih2IAwvXmTcH3IAFVWrAXJVRNa64PuS3MIj9/"
                    crossorigin="anonymous"></script>
          </body>
          </html>
          REDOC_EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
