name: Build daz-ts Package

on:
  workflow_call:

# Read-only. A reusable workflow can't exceed this even when its caller
# (release-tagged/release-nightly) grants a job more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: daz-ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: daz-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check sources and tests
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Pack tarball
        # npm pack won't create the destination directory itself.
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack

      - name: Verify pack artifact
        run: |
          # Scoped package: npm pack names it bluemoonfoundry-daz-ts-<version>.tgz.
          TARBALL=$(ls dist-pack/bluemoonfoundry-daz-ts-*.tgz 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "Error: daz-ts tarball not found in dist-pack/"
            exit 1
          fi
          echo "Artifact built successfully:"
          ls -lh dist-pack/

      - name: Upload dist artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daz-ts-dist
          path: daz-ts/dist-pack/
          if-no-files-found: error
