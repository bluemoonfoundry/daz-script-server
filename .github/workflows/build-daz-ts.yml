name: Build daz-ts Package

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: daz-ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: daz-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check sources and tests
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Pack tarball
        # npm pack won't create the destination directory itself.
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack

      - name: Verify pack artifact
        run: |
          # Scoped package: npm pack names it bluemoonfoundry-daz-ts-<version>.tgz.
          TARBALL=$(ls dist-pack/bluemoonfoundry-daz-ts-*.tgz 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "Error: daz-ts tarball not found in dist-pack/"
            exit 1
          fi
          echo "Artifact built successfully:"
          ls -lh dist-pack/

      - name: Upload dist artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daz-ts-dist
          path: daz-ts/dist-pack/
          if-no-files-found: error
