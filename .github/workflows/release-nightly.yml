name: Nightly Release

on:
  schedule:
    # Run every night at 1 AM EST (6 AM UTC in winter, 5 AM UTC in summer)
    # Using 6 AM UTC to account for EST (UTC-5)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Plugin
    uses: ./.github/workflows/build-windows.yml
    with:
      configuration: Release

  build-macos-intel:
    name: Build macOS Intel Plugin
    uses: ./.github/workflows/build-macos.yml
    with:
      architecture: x86_64
      configuration: Release

  build-macos-arm:
    name: Build macOS Apple Silicon Plugin
    uses: ./.github/workflows/build-macos.yml
    with:
      architecture: arm64
      configuration: Release

  build-macos-universal:
    name: Build macOS Universal Binary Plugin
    uses: ./.github/workflows/build-macos.yml
    with:
      architecture: universal
      configuration: Release

  build-dazpy:
    name: Build dazpy Wheel
    uses: ./.github/workflows/build-dazpy.yml

  create-nightly-release:
    name: Create Nightly Release
    needs: [build-windows, build-macos-intel, build-macos-arm, build-macos-universal, build-dazpy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous nightly date
        id: prev-nightly
        run: |
          # Try to get the previous nightly release
          PREV_NIGHTLY=$(gh release list --limit 100 --json tagName,createdAt --jq '.[] | select(.tagName | startswith("nightly-")) | .tagName' | head -1 || echo "")
          echo "prev-nightly=$PREV_NIGHTLY" >> $GITHUB_OUTPUT

          if [ -z "$PREV_NIGHTLY" ]; then
            echo "No previous nightly found"
          else
            echo "Previous nightly: $PREV_NIGHTLY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate commit summary
        id: commits
        run: |
          if [ -z "${{ steps.prev-nightly.outputs.prev-nightly }}" ]; then
            # No previous nightly, get commits since last tagged release
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              COMMITS=$(git log --oneline --no-decorate --since="24 hours ago")
            else
              COMMITS=$(git log --oneline --no-decorate ${LAST_TAG}..HEAD)
            fi
          else
            # Get commits since previous nightly
            PREV_COMMIT=$(git rev-list -n 1 ${{ steps.prev-nightly.outputs.prev-nightly }} 2>/dev/null || echo "HEAD~1")
            COMMITS=$(git log --oneline --no-decorate ${PREV_COMMIT}..HEAD)
          fi

          # Check if there are any commits
          if [ -z "$COMMITS" ]; then
            echo "has-commits=false" >> $GITHUB_OUTPUT
            echo "No new commits since last nightly"
          else
            echo "has-commits=true" >> $GITHUB_OUTPUT
            echo "$COMMITS" > commit_summary.txt
          fi

      - name: Skip if no changes
        if: steps.commits.outputs.has-commits == 'false'
        run: |
          echo "No new commits since last nightly, skipping release"
          exit 0

      - name: Generate release notes
        if: steps.commits.outputs.has-commits == 'true'
        run: |
          {
            echo "## Nightly Build - $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "> **Warning:** This is an automated nightly build. It may be unstable."
            echo ""
            echo "## Recent Changes"
            echo ""
            if [ -f commit_summary.txt ]; then
              echo "\`\`\`"
              cat commit_summary.txt
              echo "\`\`\`"
            else
              echo "No changes since last nightly."
            fi
            echo ""
            echo "## Built Artifacts"
            echo ""
            echo "- **Windows:** \`DazScriptServer-windows.dll\`"
            echo "- **macOS Intel:** \`DazScriptServer-macos-Intel.dylib\`"
            echo "- **macOS Apple Silicon:** \`DazScriptServer-macos-AppleSilicon.dylib\`"
            echo "- **macOS Universal Binary:** \`DazScriptServer-macos-Universal.dylib\`"
            echo "- **Python Package:** \`dazpy-*.whl\`"
          } > release_notes.md

      - name: Download all artifacts
        if: steps.commits.outputs.has-commits == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        if: steps.commits.outputs.has-commits == 'true'
        run: |
          mkdir -p release-assets

          # Windows DLL
          cp artifacts/DazScriptServer-windows-Release/DazScriptServer.dll \
             release-assets/DazScriptServer-windows.dll

          # macOS Intel dylib
          cp artifacts/DazScriptServer-macos-Intel-Release/DazScriptServer.dylib \
             release-assets/DazScriptServer-macos-Intel.dylib

          # macOS Apple Silicon dylib
          cp artifacts/DazScriptServer-macos-AppleSilicon-Release/DazScriptServer.dylib \
             release-assets/DazScriptServer-macos-AppleSilicon.dylib

          # macOS Universal Binary dylib
          cp artifacts/DazScriptServer-macos-Universal-Release/DazScriptServer.dylib \
             release-assets/DazScriptServer-macos-Universal.dylib

          # dazpy wheel
          cp artifacts/dazpy-wheel/*.whl release-assets/

          # List all files
          echo "Release assets:"
          ls -lh release-assets/

      - name: Delete previous nightly release
        if: steps.commits.outputs.has-commits == 'true' && steps.prev-nightly.outputs.prev-nightly != ''
        run: |
          echo "Deleting previous nightly release: ${{ steps.prev-nightly.outputs.prev-nightly }}"
          gh release delete ${{ steps.prev-nightly.outputs.prev-nightly }} --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Nightly Release
        if: steps.commits.outputs.has-commits == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly Build - $(date -u '+%Y-%m-%d')
          tag_name: nightly-${{ github.run_number }}
          body_path: release_notes.md
          files: |
            release-assets/*
          draft: false
          prerelease: true
          generate_release_notes: false
