name: Nightly Release

on:
  schedule:
    # Run every night at 1 AM EST (6 AM UTC in winter, 5 AM UTC in summer)
    # Using 6 AM UTC to account for EST (UTC-5)
    - cron: '0 6 * * *'
  workflow_dispatch:

# Read-only by default, so the build jobs (reusable workflows) get no write
# scopes. Only create-nightly-release is granted more.
permissions:
  contents: read

jobs:
  build:
    name: Build plugins, dazpy and daz-ts
    uses: ./.github/workflows/build-all.yml
    secrets:
      sdk-repo-token: ${{ secrets.SDK_REPO_TOKEN }}

  create-nightly-release:
    name: Create Nightly Release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # delete the previous nightly, create the new release
    # An explicit `shell: bash` runs steps with -eo pipefail (the implicit
    # default is plain `bash -e`), so a failing command mid-pipeline fails
    # the step instead of being masked by the last command's exit status.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get previous nightly date
        id: prev-nightly
        run: |
          set -euo pipefail
          # Newest nightly tag, or empty when there is none. A gh failure
          # (auth, API outage) fails the step rather than reading as "no
          # previous nightly", which would leave the old release undeleted.
          # jq picks the first match itself: piping to `head -1` under
          # pipefail could fail on SIGPIPE.
          PREV_NIGHTLY=$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.createdAt) | reverse | (first // {}) | .tagName // ""')
          echo "prev-nightly=$PREV_NIGHTLY" >> "$GITHUB_OUTPUT"

          if [ -z "$PREV_NIGHTLY" ]; then
            echo "No previous nightly found"
          else
            echo "Previous nightly: $PREV_NIGHTLY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate commit summary
        id: commits
        run: |
          if [ -z "${{ steps.prev-nightly.outputs.prev-nightly }}" ]; then
            # No previous nightly, get commits since last tagged release
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              COMMITS=$(git log --oneline --no-decorate --since="24 hours ago")
            else
              COMMITS=$(git log --oneline --no-decorate ${LAST_TAG}..HEAD)
            fi
          else
            # Get commits since previous nightly
            PREV_COMMIT=$(git rev-list -n 1 ${{ steps.prev-nightly.outputs.prev-nightly }} 2>/dev/null || echo "HEAD~1")
            COMMITS=$(git log --oneline --no-decorate ${PREV_COMMIT}..HEAD)
          fi

          # Check if there are any commits
          if [ -z "$COMMITS" ]; then
            echo "has-commits=false" >> $GITHUB_OUTPUT
            echo "No new commits since last nightly"
          else
            echo "has-commits=true" >> $GITHUB_OUTPUT
            echo "$COMMITS" > commit_summary.txt
          fi

      - name: Skip if no changes
        if: steps.commits.outputs.has-commits == 'false'
        run: |
          echo "No new commits since last nightly, skipping release"
          exit 0

      - name: Get current date
        if: steps.commits.outputs.has-commits == 'true'
        id: date
        run: |
          echo "date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Generate release notes
        if: steps.commits.outputs.has-commits == 'true'
        run: |
          {
            echo "## Nightly Build - ${{ steps.date.outputs.datetime }}"
            echo ""
            echo "> **Warning:** This is an automated nightly build. It may be unstable."
            echo ""
            echo "## Recent Changes"
            echo ""
            if [ -f commit_summary.txt ]; then
              echo "\`\`\`"
              cat commit_summary.txt
              echo "\`\`\`"
            else
              echo "No changes since last nightly."
            fi
            echo ""
            echo "## Built Artifacts"
            echo ""
            echo "### DAZ Studio 4.5+"
            echo "- **Windows:** \`DazScriptServer-ds4-windows.dll\`"
            echo "- **macOS Intel:** \`DazScriptServer-ds4-macos-Intel.dylib\`"
            echo "- **macOS Apple Silicon:** \`DazScriptServer-ds4-macos-AppleSilicon.dylib\`"
            echo ""
            echo "### Daz Studio 6.26"
            echo "- **Windows:** \`dsp_DazScriptServer-ds6.26-windows.dll\`"
            echo "- **macOS (Intel & Apple Silicon):** \`libdsp_DazScriptServer-ds6.26-macos.dylib\`"
            echo ""
            echo "> Daz Studio 6.26 only loads plugins built against its own SDK. **Daz Studio 6.25 users:**"
            echo "> use [v2.9.3](https://github.com/bluemoonfoundry/daz-script-server/releases/tag/v2.9.3), the last 6.25-compatible release,"
            echo "> and pin the Python client with \`pip install dazpy==2.9.3\`."
            echo ""
            echo "### Python"
            echo "- **Python Package:** \`dazpy-*.whl\`"
            echo ""
            echo "### TypeScript"
            echo "- **daz-ts Package:** \`bluemoonfoundry-daz-ts-*.tgz\` (also on npm: \`npm install @bluemoonfoundry/daz-ts\`)"
          } > release_notes.md

      - name: Download all artifacts
        if: steps.commits.outputs.has-commits == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release assets
        if: steps.commits.outputs.has-commits == 'true'
        run: |
          mkdir -p release-assets

          # Windows DLLs
          cp artifacts/DazScriptServer-windows-ds4-Release/DazScriptServer.dll \
             release-assets/DazScriptServer-ds4-windows.dll
          cp artifacts/DazScriptServer-windows-ds6-Release/dsp_DazScriptServer.dll \
             release-assets/dsp_DazScriptServer-ds6.26-windows.dll

          # macOS dylibs
          cp artifacts/DazScriptServer-macos-Intel-ds4-Release/DazScriptServer.dylib \
             release-assets/DazScriptServer-ds4-macos-Intel.dylib
          cp artifacts/DazScriptServer-macos-AppleSilicon-ds4-Release/DazScriptServer.dylib \
             release-assets/DazScriptServer-ds4-macos-AppleSilicon.dylib
          cp artifacts/DazScriptServer-macos-Intel-ds6-Release/libdsp_DazScriptServer.dylib \
             release-assets/libdsp_DazScriptServer-ds6.26-macos.dylib

          # dazpy wheel
          cp artifacts/dazpy-dist/*.whl release-assets/

          # daz-ts tarball
          cp artifacts/daz-ts-dist/*.tgz release-assets/

          # List all files
          echo "Release assets:"
          ls -lh release-assets/

      - name: Delete previous nightly release
        if: steps.commits.outputs.has-commits == 'true' && steps.prev-nightly.outputs.prev-nightly != ''
        run: |
          set -euo pipefail
          echo "Deleting previous nightly release: $PREV_NIGHTLY"
          gh release delete "$PREV_NIGHTLY" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_NIGHTLY: ${{ steps.prev-nightly.outputs.prev-nightly }}

      - name: Create Nightly Release
        if: steps.commits.outputs.has-commits == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Nightly Build - ${{ steps.date.outputs.date }}
          tag_name: nightly-${{ github.run_number }}
          body_path: release_notes.md
          files: |
            release-assets/*
          draft: false
          prerelease: true
          generate_release_notes: false
