name: Build Windows Plugin

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: false
        type: string
        default: 'Release'
      sdk-version:
        description: 'Target DAZ Studio SDK major version (4 or 6)'
        required: false
        type: string
        default: '4'
    secrets:
      sdk-repo-token:
        description: 'Token for accessing private SDK repository'
        required: true
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

# Read-only. A reusable workflow can't exceed this even when its caller
# (release-tagged/release-nightly) grants a job more.
permissions:
  contents: read

# SDK repo ref, cache keys and Qt6 version: .github/actions/setup-daz-sdk.

jobs:
  build:
    runs-on: windows-2022
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up DAZ Studio SDK (and Qt6 for SDK 6)
        id: sdk
        uses: ./.github/actions/setup-daz-sdk
        with:
          sdk-version: ${{ inputs.sdk-version }}
          os: windows
          sdk-repo-token: ${{ secrets.sdk-repo-token }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Install Visual C++ 2010 Redistributable
        if: inputs.sdk-version != '6'
        shell: pwsh
        run: |
          # Qt 4.8 from 2014 likely needs VS 2010 redistributables
          # Download and install VC++ 2010 x64
          $ErrorActionPreference = 'Stop'
          $vcRedistUrl = "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe"
          # SHA-256 of the 10,277,328-byte installer at that URL (verified 2026-11-26).
          $expectedSha256 = "F3B7A76D84D23F91957AA18456A14B4E90609E4CE8194C5653384ED38DADA6F3"
          $installerPath = "$env:TEMP\vcredist_x64_2010.exe"

          Write-Host "Downloading VC++ 2010 Redistributable..."
          Invoke-WebRequest -Uri $vcRedistUrl -OutFile $installerPath

          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $installerPath).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "vcredist_x64.exe SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          $sig = Get-AuthenticodeSignature -FilePath $installerPath
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation,') {
            throw "vcredist_x64.exe Authenticode check failed: status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
          }

          Write-Host "Installing VC++ 2010 Redistributable..."
          $proc = Start-Process -FilePath $installerPath -ArgumentList "/install", "/quiet", "/norestart" -Wait -PassThru
          # 0 = installed, 3010 = installed (reboot pending), 1638 = same or newer version already present.
          if ($proc.ExitCode -notin 0, 3010, 1638) {
            throw "VC++ 2010 Redistributable installer failed with exit code $($proc.ExitCode)"
          }

          Write-Host "VC++ 2010 Redistributable installed (exit code $($proc.ExitCode))"

      - name: Configure CMake (v4)
        if: inputs.sdk-version != '6'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\DAZStudio4.5+ SDK\bin\x64;$env:PATH"

          cmake -B build -S . `
            -DDAZ_SDK_DIR="${{ github.workspace }}\DAZStudio4.5+ SDK" `
            -DDAZ_SDK_VERSION=4 `
            -DCMAKE_BUILD_TYPE=${{ inputs.configuration }}

      - name: Configure CMake (v6)
        if: inputs.sdk-version == '6'
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DDAZ_SDK_DIR="${{ github.workspace }}\Daz Studio 6 SDK" `
            -DDAZ_SDK_VERSION=6 `
            -DQt6_DIR="${{ steps.sdk.outputs.qt6-dir }}" `
            -DCMAKE_BUILD_TYPE=${{ inputs.configuration }}

      - name: Build with MSBuild
        shell: bash
        run: |
          cmake --build build --config ${{ inputs.configuration }} --verbose

      - name: Verify build output
        shell: bash
        run: |
          DLL_PATH="build/plugin/${{ inputs.configuration }}/${{ steps.sdk.outputs.binary-name }}"
          if [ ! -f "$DLL_PATH" ]; then
            echo "Error: DLL not found at $DLL_PATH"
            exit 1
          fi
          echo "Build successful: $DLL_PATH"
          ls -lh "$DLL_PATH"

      - name: Verify DS6 SDK version tag
        if: inputs.sdk-version == '6'
        shell: bash
        run: |
          # Daz Studio 6.26+ rejects plugins without a DzPluginSDKVersionTag
          # matching its SDK range (issue #45).
          python scripts/check_sdk_tag.py             "build/plugin/${{ inputs.configuration }}/${{ steps.sdk.outputs.binary-name }}"             "Daz Studio 6 SDK/include"

      - name: Upload Windows DLL artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DazScriptServer-windows-ds${{ inputs.sdk-version }}-${{ inputs.configuration }}
          path: build/plugin/${{ inputs.configuration }}/${{ steps.sdk.outputs.binary-name }}
          if-no-files-found: error
