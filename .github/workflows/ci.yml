name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
    branches: [master, main]

jobs:
  version-consistency:
    name: Release version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check version is the same in every file
        run: python scripts/check_version_consistency.py
      - name: Check daz-ts version is the same in package.json and package-lock.json
        run: python scripts/check_daz_ts_version.py

  openapi-parity:
    name: Route / OpenAPI parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check routes, companion-plugin routes and SDK calls against openapi.yaml
        run: python scripts/check_openapi_parity.py --sdk-report sdk-coverage.md
      - name: Publish SDK endpoint coverage
        if: always()
        run: |
          if [ -f sdk-coverage.md ]; then cat sdk-coverage.md >> "$GITHUB_STEP_SUMMARY"; fi

  lint:
    name: Python lint (ruff) and type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dazpy, ruff and mypy
        run: pip install -e ".[aio]" ruff mypy types-requests
      # Rule selection lives in pyproject.toml [tool.ruff.lint].
      - name: ruff check
        run: ruff check --output-format=github dazpy scripts tests
      - name: mypy dazpy
        run: mypy dazpy

  daz-ts:
    name: daz-ts build, type-check and unit tests
    uses: ./.github/workflows/build-daz-ts.yml

  unit-tests:
    name: dazpy unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dazpy and test dependencies
        run: pip install -e ".[aio,test]"

      - name: Run unit tests
        run: python tests.py unit
