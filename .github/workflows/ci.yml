name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
    branches: [master, main]

jobs:
  version-consistency:
    name: Release version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version is the same in every file
        run: python scripts/check_version_consistency.py

  openapi-parity:
    name: Route / OpenAPI parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check routes, companion-plugin routes and SDK calls against openapi.yaml
        run: python scripts/check_openapi_parity.py --sdk-report sdk-coverage.md
      - name: Publish SDK endpoint coverage
        if: always()
        run: |
          if [ -f sdk-coverage.md ]; then cat sdk-coverage.md >> "$GITHUB_STEP_SUMMARY"; fi

  daz-ts:
    name: daz-ts build, type-check and unit tests
    uses: ./.github/workflows/build-daz-ts.yml

  unit-tests:
    name: dazpy unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dazpy and test dependencies
        run: pip install -e ".[docs]" requests jsonschema

      - name: Run unit tests
        run: python tests.py unit
