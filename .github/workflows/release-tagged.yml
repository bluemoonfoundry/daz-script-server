name: Tagged Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Plugin
    uses: ./.github/workflows/build-windows.yml
    with:
      configuration: Release

  build-macos-intel:
    name: Build macOS Intel Plugin
    uses: ./.github/workflows/build-macos.yml
    with:
      architecture: x86_64
      configuration: Release

  build-macos-arm:
    name: Build macOS Apple Silicon Plugin
    uses: ./.github/workflows/build-macos.yml
    with:
      architecture: arm64
      configuration: Release

  build-macos-universal:
    name: Build macOS Universal Binary Plugin
    uses: ./.github/workflows/build-macos.yml
    with:
      architecture: universal
      configuration: Release

  build-dazpy:
    name: Build dazpy Wheel
    uses: ./.github/workflows/build-dazpy.yml

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos-intel, build-macos-arm, build-macos-universal, build-dazpy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.tag.outputs.tag }}^ 2>/dev/null || echo "")
          echo "prev-tag=$PREV_TAG" >> $GITHUB_OUTPUT
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, will include all commits"
          else
            echo "Previous tag: $PREV_TAG"
          fi

      - name: Generate commit summary
        id: commits
        run: |
          if [ -z "${{ steps.prev-tag.outputs.prev-tag }}" ]; then
            COMMITS=$(git log --oneline --no-decorate)
          else
            COMMITS=$(git log --oneline --no-decorate ${{ steps.prev-tag.outputs.prev-tag }}..${{ steps.tag.outputs.tag }})
          fi

          # Save to a file to handle multiline output
          echo "$COMMITS" > commit_summary.txt

          # Create formatted release notes
          {
            echo "## Changes since ${{ steps.prev-tag.outputs.prev-tag || 'initial commit' }}"
            echo ""
            echo "\`\`\`"
            cat commit_summary.txt
            echo "\`\`\`"
            echo ""
            echo "## Built Artifacts"
            echo ""
            echo "- **Windows:** \`DazScriptServer-windows.dll\`"
            echo "- **macOS Intel:** \`DazScriptServer-macos-Intel.dylib\`"
            echo "- **macOS Apple Silicon:** \`DazScriptServer-macos-AppleSilicon.dylib\`"
            echo "- **macOS Universal Binary:** \`DazScriptServer-macos-Universal.dylib\`"
            echo "- **Python Package:** \`dazpy-*.whl\`"
          } > release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Windows DLL
          cp artifacts/DazScriptServer-windows-Release/DazScriptServer.dll \
             release-assets/DazScriptServer-windows.dll

          # macOS Intel dylib
          cp artifacts/DazScriptServer-macos-Intel-Release/DazScriptServer.dylib \
             release-assets/DazScriptServer-macos-Intel.dylib

          # macOS Apple Silicon dylib
          cp artifacts/DazScriptServer-macos-AppleSilicon-Release/DazScriptServer.dylib \
             release-assets/DazScriptServer-macos-AppleSilicon.dylib

          # macOS Universal Binary dylib
          cp artifacts/DazScriptServer-macos-Universal-Release/DazScriptServer.dylib \
             release-assets/DazScriptServer-macos-Universal.dylib

          # dazpy wheel
          cp artifacts/dazpy-wheel/*.whl release-assets/

          # List all files
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
