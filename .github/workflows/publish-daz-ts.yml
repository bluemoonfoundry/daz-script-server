name: Publish daz-ts

# daz-ts has its own release train: push a daz-ts-v<version> tag (matching
# daz-ts/package.json) to publish @bluemoonfoundry/daz-ts to npm. Plugin v*
# tags (release-tagged.yml) never publish to npm, so a plugin release without
# a daz-ts bump can't fail on an already-published npm version.
#
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN secret. The trusted
# publisher on npmjs.com must name this repository and this workflow file
# (publish-daz-ts.yml). npm attaches provenance automatically.

on:
  push:
    tags:
      - 'daz-ts-v*.*.*'

permissions:
  contents: read

jobs:
  check-version:
    # npm versions are immutable and the publish step skips one that already
    # exists, so a tag without a package.json bump would publish nothing.
    name: Check tag matches daz-ts version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check daz-ts version against the tag
        run: python scripts/check_daz_ts_version.py --tag "${GITHUB_REF_NAME}"

  build-daz-ts:
    name: Build daz-ts Package
    needs: check-version
    uses: ./.github/workflows/build-daz-ts.yml

  publish-npm:
    name: Publish to npm
    needs: build-daz-ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing + provenance

    steps:
      - name: Download daz-ts dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daz-ts-dist
          path: dist-pack/

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Publish (skip if this version is already on npm)
        run: |
          TARBALL=$(ls dist-pack/bluemoonfoundry-daz-ts-*.tgz | head -1)
          VERSION="${GITHUB_REF_NAME#daz-ts-v}"
          if npm view "@bluemoonfoundry/daz-ts@${VERSION}" version >/dev/null 2>&1; then
            echo "@bluemoonfoundry/daz-ts@${VERSION} is already on npm; skipping publish."
            exit 0
          fi
          npm publish "$TARBALL" --access public

  github-release:
    # Keep the tarball on GitHub releases too, for offline installs.
    name: Attach tarball to GitHub release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download daz-ts dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daz-ts-dist
          path: dist-pack/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body: |
            daz-ts ${{ github.ref_name }}, the TypeScript SDK for DazScriptServer.

            ```bash
            npm install @bluemoonfoundry/daz-ts
            ```

            npm: https://www.npmjs.com/package/@bluemoonfoundry/daz-ts
          files: dist-pack/*.tgz
          # The plugin release stays "Latest" on the releases page.
          make_latest: 'false'
          draft: false
          prerelease: false
