name: Build macOS Plugin

on:
  workflow_call:
    inputs:
      architecture:
        description: 'Target architecture (x86_64, arm64, or universal)'
        required: true
        type: string
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: false
        type: string
        default: 'Release'
      sdk-version:
        description: 'Target DAZ Studio SDK major version (4 or 6)'
        required: false
        type: string
        default: '4'
    secrets:
      sdk-repo-token:
        description: 'Token for accessing private SDK repository'
        required: true
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

# Read-only. A reusable workflow can't exceed this even when its caller
# (release-tagged/release-nightly) grants a job more.
permissions:
  contents: read

# SDK repo ref, cache keys and Qt6 version: .github/actions/setup-daz-sdk.

jobs:
  build:
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set architecture flags
        id: arch-flags
        run: |
          case "${{ inputs.architecture }}" in
            x86_64)
              echo "cmake-arch=x86_64" >> $GITHUB_OUTPUT
              echo "runner-desc=Intel" >> $GITHUB_OUTPUT
              ;;
            arm64)
              echo "cmake-arch=arm64" >> $GITHUB_OUTPUT
              echo "runner-desc=AppleSilicon" >> $GITHUB_OUTPUT
              ;;
            universal)
              echo "cmake-arch=x86_64;arm64" >> $GITHUB_OUTPUT
              echo "runner-desc=Universal" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Error: Unknown architecture ${{ inputs.architecture }}"
              exit 1
              ;;
          esac

          # daz-studio-6-sdk-macos only ships an x86_64 Mac64/libdzcore.dylib
          # (no arm64 slice). DAZ Studio 6 itself runs under Rosetta 2 on
          # Apple Silicon, so an x86_64-only plugin loads and runs there
          # transparently — build x86_64 for DS6 regardless of the
          # requested architecture, keeping the runner/artifact labeled by
          # audience (Intel/AppleSilicon/Universal) rather than by the
          # actual slice compiled.
          if [ "${{ inputs.sdk-version }}" = "6" ]; then
            echo "cmake-arch=x86_64" >> $GITHUB_OUTPUT
          fi

          # DAZStudio4.5+ SDK bundles Qt 4.8, which predates Apple Silicon:
          # its qatomic platform dispatch falls back to a bogus PowerPC
          # atomics path on arm64 (qatomic_powerpc.h asm constraint error)
          # rather than a real arm64 implementation. DAZ Studio 4 itself
          # runs under Rosetta 2 on Apple Silicon same as DS6, so build
          # x86_64 for DS4 regardless of the requested architecture too.
          if [ "${{ inputs.sdk-version }}" = "4" ]; then
            echo "cmake-arch=x86_64" >> $GITHUB_OUTPUT
          fi

      - name: Set up DAZ Studio SDK (and Qt6 for SDK 6)
        id: sdk
        uses: ./.github/actions/setup-daz-sdk
        with:
          sdk-version: ${{ inputs.sdk-version }}
          os: macos
          sdk-repo-token: ${{ secrets.sdk-repo-token }}

      - name: Select Xcode (v6 needs recent libc++/Clang for Qt6)
        if: inputs.sdk-version == '6'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Configure CMake (v4)
        if: inputs.sdk-version != '6'
        run: |
          cmake -B build -S . \
            -DDAZ_SDK_DIR="${{ github.workspace }}/DAZStudio4.5+ SDK" \
            -DDAZ_SDK_VERSION=4 \
            -DCMAKE_BUILD_TYPE=${{ inputs.configuration }} \
            -DCMAKE_OSX_ARCHITECTURES="${{ steps.arch-flags.outputs.cmake-arch }}"

      - name: Configure CMake (v6)
        if: inputs.sdk-version == '6'
        run: |
          cmake -B build -S . \
            -DDAZ_SDK_DIR="${{ github.workspace }}/Daz Studio 6 SDK" \
            -DDAZ_SDK_VERSION=6 \
            -DQt6_DIR="${{ steps.sdk.outputs.qt6-dir }}" \
            -DCMAKE_BUILD_TYPE=${{ inputs.configuration }} \
            -DCMAKE_OSX_ARCHITECTURES="${{ steps.arch-flags.outputs.cmake-arch }}"

      - name: Build with CMake
        run: |
          cmake --build build --config ${{ inputs.configuration }} --verbose

      - name: Verify build output
        run: |
          DYLIB_PATH="build/plugin/${{ steps.sdk.outputs.binary-name }}"
          if [ ! -f "$DYLIB_PATH" ]; then
            echo "Error: dylib not found at $DYLIB_PATH"
            exit 1
          fi
          echo "Build successful: $DYLIB_PATH"
          ls -lh "$DYLIB_PATH"
          file "$DYLIB_PATH"
          lipo -info "$DYLIB_PATH"

      - name: Verify DS6 SDK version tag
        if: inputs.sdk-version == '6'
        run: |
          python3 scripts/check_sdk_tag.py             "build/plugin/${{ steps.sdk.outputs.binary-name }}"             "Daz Studio 6 SDK/include"

      - name: Upload macOS dylib artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DazScriptServer-macos-${{ steps.arch-flags.outputs.runner-desc }}-ds${{ inputs.sdk-version }}-${{ inputs.configuration }}
          path: build/plugin/${{ steps.sdk.outputs.binary-name }}
          if-no-files-found: error
