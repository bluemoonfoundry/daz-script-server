name: Build dazpy Wheel

on:
  workflow_call:
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

# Read-only. A reusable workflow can't exceed this even when its caller
# (release-tagged/release-nightly) grants a job more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: |
          python -m build --outdir dist

      - name: Verify dist artifacts
        run: |
          WHEEL_FILE=$(ls dist/dazpy-*.whl 2>/dev/null | head -1)
          SDIST_FILE=$(ls dist/dazpy-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "Error: wheel not found in dist/"
            exit 1
          fi
          if [ -z "$SDIST_FILE" ]; then
            echo "Error: sdist not found in dist/"
            exit 1
          fi
          echo "Artifacts built successfully:"
          ls -lh dist/

      - name: Upload dist artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dazpy-dist
          path: dist/
          if-no-files-found: error
