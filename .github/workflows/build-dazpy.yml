name: Build dazpy Wheel

on:
  workflow_call:
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: |
          python -m build --outdir dist

      - name: Verify dist artifacts
        run: |
          WHEEL_FILE=$(ls dist/dazpy-*.whl 2>/dev/null | head -1)
          SDIST_FILE=$(ls dist/dazpy-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "Error: wheel not found in dist/"
            exit 1
          fi
          if [ -z "$SDIST_FILE" ]; then
            echo "Error: sdist not found in dist/"
            exit 1
          fi
          echo "Artifacts built successfully:"
          ls -lh dist/

      - name: Upload dist artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dazpy-dist
          path: dist/
          if-no-files-found: error
