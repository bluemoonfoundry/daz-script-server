name: Test Build (Manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - all
          - windows
          - macos-intel
          - macos-arm
          - dazpy
          - daz-ts
        default: 'all'
      sdk-version:
        description: 'DAZ Studio SDK version to build (ignored for dazpy)'
        required: false
        type: choice
        options:
          - both
          - '4'
          - '6'
        default: 'both'
      configuration:
        description: 'Build configuration'
        required: false
        type: choice
        options:
          - Release
          - Debug
        default: 'Release'

# Read-only by default.
permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-all.yml
    with:
      platform: ${{ inputs.platform }}
      sdk-version: ${{ inputs.sdk-version }}
      configuration: ${{ inputs.configuration }}
    secrets:
      sdk-repo-token: ${{ secrets.SDK_REPO_TOKEN }}
