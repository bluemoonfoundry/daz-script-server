[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dazpy"
version = "2.1.0"
description = "Python SDK for the DAZ Studio Script Server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/bluemoonfoundry/daz-script-server"
Repository = "https://github.com/bluemoonfoundry/daz-script-server"
"Bug Tracker" = "https://github.com/bluemoonfoundry/daz-script-server/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[tool.setuptools.packages.find]
include = ["dazpy*"]

[tool.setuptools.package-data]
dazpy = ["py.typed"]
