[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dazpy"
version = "2.15.0"
description = "Python SDK for the DAZ Studio Script Server"
readme = "dazpy/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/bluemoonfoundry/daz-script-server"
Repository = "https://github.com/bluemoonfoundry/daz-script-server"
"Bug Tracker" = "https://github.com/bluemoonfoundry/daz-script-server/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
aio = [
    "httpx>=0.24",
]
# Everything the offline unit suites import (python tests.py unit plus the
# pytest-only suites such as tests/test_dazpy_aio.py).
test = [
    "httpx>=0.24",
    "jsonschema>=4.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "watchdog>=3.0",
]

[tool.setuptools]
# Ship only dazpy's MIT license. Without this, setuptools' default glob also
# picks up the repo-root LICENSE (AGPL, covers the plugin, not dazpy).
license-files = ["dazpy/LICENSE"]

[tool.setuptools.packages.find]
include = ["dazpy*"]

[tool.setuptools.package-data]
dazpy = ["py.typed", "schemas/*.json"]
